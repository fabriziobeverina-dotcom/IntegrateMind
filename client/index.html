    <meta name="description" content="A comprehensive platform for ayahuasca integration with journaling, daily practices, community support, and progress tracking.">

    <!-- PWA Manifest -->

    <!-- Service Worker registration — inline so it fires immediately before any bundle loads -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function(err) { console.warn('[PWA] SW registration failed:', err); });
      }
    </script>
