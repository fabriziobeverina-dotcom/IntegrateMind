<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE RETURN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Space+Mono:wght@400;700&display=swap');

:root {
  --earth:    #0d0a06;
  --parch:    #f0e6c8;
  --ember:    #c8421a;
  --gold:     #c8952a;
  --vine:     #2d5a27;
  --spirit:   #4a9a7a;
  --smoke:    rgba(200,180,140,0.08);
  --ink:      rgba(200,149,42,0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--earth);
  color: var(--parch);
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 18px;
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Organic noise texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 85%, rgba(45,90,39,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 15%, rgba(200,149,42,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(13,10,6,0.4) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

#game {
  position: relative;
  z-index: 2;
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 24px 100px;
}

/* HEADER */
.gh {
  text-align: center;
  margin-bottom: 36px;
  padding-bottom: 24px;
  position: relative;
}
.gh::after {
  content: '';
  display: block;
  width: 100%;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(200,149,42,0.4), transparent);
  margin-top: 20px;
}
.gt {
  font-family: 'Cinzel', serif;
  font-size: clamp(2rem, 7vw, 3.4rem);
  letter-spacing: 0.22em;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 6px;
  text-shadow: 0 0 60px rgba(200,149,42,0.25);
}
.gs {
  font-family: 'Crimson Pro', serif;
  font-style: italic;
  color: rgba(240,230,200,0.4);
  font-size: 0.95rem;
  letter-spacing: 0.08em;
}

/* ILLUSTRATION */
.art-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 32px;
}
.art-frame {
  position: relative;
  width: 100%;
  max-width: 640px;
  overflow: hidden;
  border-radius: 2px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
  border-top: 1px solid rgba(200,149,42,0.2);
  border-bottom: 1px solid rgba(200,149,42,0.2);
  isolation: isolate;
}
.art-frame img {
  width: 100%;
  height: auto;
  display: block;
  filter: saturate(1.05) contrast(1.02);
  position: relative;
  z-index: 0;
}
/* Aura — soft breathing halo */
.art-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(200,149,42,0.22), transparent 55%),
    radial-gradient(ellipse at 75% 65%, rgba(74,154,122,0.18), transparent 60%);
  mix-blend-mode: screen;
  animation: aura-breathe 7s ease-in-out infinite;
}
/* Energy currents — slow drifting light veils */
.art-frame::after {
  content: '';
  position: absolute;
  inset: -20%;
  pointer-events: none;
  z-index: 3;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,220,150,0.10), transparent 25%),
    radial-gradient(circle at 70% 20%, rgba(180,140,220,0.08), transparent 30%),
    radial-gradient(circle at 50% 80%, rgba(120,200,180,0.09), transparent 28%);
  mix-blend-mode: screen;
  filter: blur(6px);
  animation: aura-drift 22s linear infinite;
}
.art-wrap.cere .art-frame {
  border-color: rgba(74,154,122,0.35);
  box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 32px rgba(74,154,122,0.28);
}
.art-wrap.cere .art-frame::before {
  background:
    radial-gradient(ellipse at 50% 50%, rgba(74,154,122,0.35), transparent 60%),
    radial-gradient(ellipse at 20% 80%, rgba(200,149,42,0.18), transparent 55%);
  animation-duration: 5s;
}
.art-wrap.guide .art-frame {
  border-color: rgba(200,149,42,0.4);
  box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 32px rgba(200,149,42,0.24);
}
.art-wrap.guide .art-frame::before {
  background:
    radial-gradient(ellipse at 50% 45%, rgba(255,210,120,0.32), transparent 55%),
    radial-gradient(ellipse at 80% 70%, rgba(200,149,42,0.20), transparent 60%);
  animation-duration: 6s;
}
@keyframes aura-breathe {
  0%, 100% { opacity: 0.55; transform: scale(1); }
  50%      { opacity: 0.95; transform: scale(1.04); }
}
@keyframes aura-drift {
  0%   { transform: translate(0,0) rotate(0deg); }
  50%  { transform: translate(2%,-1%) rotate(180deg); }
  100% { transform: translate(0,0) rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .art-frame::before, .art-frame::after { animation: none; }
}

/* DOMAIN BAR */
.dbar {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  justify-content: center;
}
.dp {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  padding: 4px 12px;
  border: 1px solid rgba(200,149,42,0.18);
  color: rgba(240,230,200,0.22);
  text-transform: uppercase;
  border-radius: 2px;
  cursor: default;
  position: relative;
}
.dp::after {
  content: attr(title);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(13,10,6,0.95);
  border: 1px solid rgba(200,149,42,0.2);
  color: rgba(240,230,200,0.7);
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  padding: 4px 8px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  font-family: 'Crimson Pro', serif;
  font-style: italic;
}
.dp:hover::after { opacity: 1; }
.dp.on  { border-color: var(--ember); color: var(--parch); background: rgba(200,66,26,0.1); }
.dp.on::before { content: '▲ '; color: var(--ember); }
.dp.deep { border-color: var(--spirit); color: var(--spirit); background: rgba(74,154,122,0.08); }
.dp.deep::before { content: '◆ '; }

/* SCENE */
.scene { animation: emerge .6s ease; }
@keyframes emerge {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.slabel {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  color: rgba(200,149,42,0.55);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.stitle {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.3rem, 4vw, 1.9rem);
  font-weight: 400;
  color: var(--parch);
  margin-bottom: 22px;
  line-height: 1.25;
  letter-spacing: 0.03em;
}

.sbody {
  font-size: 1.08rem;
  color: rgba(240,230,200,0.88);
  margin-bottom: 28px;
  font-weight: 300;
}
.sbody p { margin-bottom: 1em; }

/* TEXT BLOCKS */
.vis {
  font-style: italic;
  color: var(--spirit);
  padding: 12px 0 12px 18px;
  border-left: 2px solid var(--spirit);
  margin: 20px 0;
  line-height: 1.9;
  font-weight: 300;
}
.shv {
  font-style: italic;
  color: #c85040;
  padding: 12px 0 12px 18px;
  border-left: 2px solid #c85040;
  margin: 20px 0;
  line-height: 1.9;
}
.mecho {
  font-style: italic;
  color: rgba(200,149,42,0.7);
  padding: 12px 0 12px 18px;
  border-left: 2px solid rgba(200,149,42,0.3);
  margin: 20px 0;
  line-height: 1.9;
  font-size: 0.98rem;
}
.ctext {
  font-style: italic;
  color: #7adab8;
  padding: 12px 0 12px 18px;
  border-left: 2px dashed var(--spirit);
  margin: 20px 0;
  line-height: 1.95;
  font-weight: 300;
}
.jmirror {
  color: rgba(220,200,160,0.65);
  padding: 12px 0 12px 18px;
  border-left: 1px dotted rgba(200,149,42,0.35);
  margin: 20px 0;
  line-height: 1.9;
  font-size: 0.98rem;
  font-style: italic;
}
.guide-text {
  font-style: italic;
  color: #f0e8b8;
  padding: 14px 0 14px 18px;
  border-left: 3px solid var(--gold);
  margin: 20px 0;
  font-size: 1.12rem;
  line-height: 1.85;
}

/* SOMATIC BRIDGE */
.somatic-bridge {
  background: rgba(74,154,122,0.07);
  border: 1px solid rgba(74,154,122,0.3);
  border-radius: 3px;
  padding: 20px 22px;
  margin: 22px 0;
}
.soma-title {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--spirit);
  margin-bottom: 10px;
}
.soma-text {
  font-style: italic;
  color: rgba(240,230,200,0.82);
  line-height: 1.8;
  font-size: 1rem;
}
.soma-skip {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  color: rgba(240,230,200,0.22);
  margin-top: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  cursor: pointer;
  text-decoration: underline;
}
.soma-skip:hover { color: rgba(240,230,200,0.5); }

/* CHOICES */
.choices { display: flex; flex-direction: column; gap: 10px; }

.cb {
  background: transparent;
  border: 1px solid rgba(200,149,42,0.22);
  color: var(--parch);
  font-family: 'Crimson Pro', serif;
  font-size: 1.05rem;
  font-weight: 300;
  padding: 16px 20px;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  border-radius: 2px;
  transition: all 0.2s ease;
  position: relative;
}
.cb::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(200,149,42,0.06) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.2s;
  border-radius: 2px;
}
.cb:hover { border-color: var(--gold); color: var(--gold); }
.cb:hover::before { opacity: 1; }
.cb .ck {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: rgba(200,149,42,0.5);
  letter-spacing: 0.1em;
  margin-right: 12px;
}
.cb.cere { border-color: rgba(74,154,122,0.3); color: rgba(200,240,220,0.85); }
.cb.cere:hover { border-color: var(--spirit); color: #7adab8; }
.cb.guide { border-color: rgba(200,149,42,0.4); }
.cb.guide:hover { border-color: var(--gold); }

/* DIVIDER */
.sigil {
  text-align: center;
  color: rgba(200,149,42,0.18);
  font-size: 1.2rem;
  margin: 24px 0;
  letter-spacing: 0.5em;
}

/* SOUND BUTTON */
#mtoggle {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 100;
  background: rgba(13,10,6,0.9);
  border: 1px solid rgba(200,149,42,0.35);
  color: rgba(200,149,42,0.6);
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 2px;
  backdrop-filter: blur(4px);
}
#mtoggle:hover { border-color: var(--gold); color: var(--gold); }

/* PORTRAIT */
.portrait { animation: emerge .5s ease; }
.parch-kicker {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-align: center;
  color: rgba(200,149,42,0.55);
  margin-bottom: 14px;
}
.ptitle {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 400;
  color: var(--gold);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.06em;
  text-shadow: 0 0 40px rgba(200,149,42,0.2);
}
.parch-sub {
  font-style: italic;
  text-align: center;
  color: rgba(200,149,42,0.65);
  margin-bottom: 28px;
  font-size: 0.95rem;
}
.parch-reading,
.parch-inflection {
  max-width: 680px;
  margin: 0 auto 22px;
  color: rgba(240,230,200,0.82);
  font-size: 1.08rem;
  line-height: 1.85;
}
.parch-inflection {
  padding: 18px 20px;
  border-left: 2px solid rgba(200,149,42,0.5);
  color: rgba(240,230,200,0.62);
  font-style: italic;
  margin-bottom: 28px;
}
.dentry {
  padding: 16px 0;
  border-bottom: 1px solid rgba(200,149,42,0.1);
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 14px;
  align-items: start;
}
.dname {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(200,149,42,0.55);
  padding-top: 3px;
}
.dtext { font-size: 1rem; color: rgba(240,230,200,0.78); font-weight: 300; }
.srep {
  background: rgba(200,66,26,0.06);
  border: 1px solid rgba(200,66,26,0.25);
  padding: 20px 22px;
  margin: 26px 0;
  border-radius: 2px;
}
.srep h3 {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  color: rgba(200,66,26,0.6);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.srep p { font-style: italic; font-size: 0.98rem; line-height: 1.75; margin-bottom: 12px; color: rgba(240,230,200,0.7); }

.restart {
  display: block;
  width: 100%;
  background: transparent;
  border: 1px solid rgba(200,149,42,0.3);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  padding: 16px;
  cursor: pointer;
  margin-top: 32px;
  border-radius: 2px;
  transition: all 0.25s;
}
.restart:hover { background: rgba(200,149,42,0.08); border-color: var(--gold); }

/* INTRO */
.mintro { text-align: center; padding: 32px 12px; }
.msym { font-size: 3.2rem; display: block; margin-bottom: 20px; opacity: 0.7; animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 0%,100%{transform:scale(1);opacity:0.7;} 50%{transform:scale(1.06);opacity:0.95;} }
.mintro h2 { font-family: 'Cinzel', serif; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 400; color: var(--gold); margin-bottom: 18px; letter-spacing: 0.1em; }
.mintro p { color: rgba(240,230,200,0.6); max-width: 460px; margin: 0 auto 24px; font-weight: 300; font-style: italic; }
.bbtn {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  padding: 14px 40px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.3s;
}
.bbtn:hover { background: rgba(200,149,42,0.1); letter-spacing: 0.2em; }

/* Floating particles — embers */
.ember-particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  animation: drift linear infinite;
  z-index: 0;
}
@keyframes drift {
  0%   { transform: translateY(100vh) translateX(0) rotate(0); opacity: 0; }
  8%   { opacity: 0.4; }
  92%  { opacity: 0.12; }
  100% { transform: translateY(-5vh) translateX(30px) rotate(180deg); opacity: 0; }
}

/* Watermark */

/* CONSEQUENCE BEAT */
.consequence {
  animation: emerge .5s ease;
  padding: 8px 0;
}
.chosen-action {
  font-style: italic;
  color: rgba(240,230,200,0.45);
  font-size: 0.9rem;
  margin-bottom: 22px;
  padding-left: 18px;
  border-left: 1px solid rgba(200,149,42,0.2);
  line-height: 1.7;
}
.echo-text {
  font-size: 1.08rem;
  color: rgba(240,230,200,0.9);
  line-height: 1.88;
  margin-bottom: 28px;
  font-weight: 300;
}
.echo-text p { margin-bottom: 0.9em; }
.continue-btn {
  background: transparent;
  border: 1px solid rgba(200,149,42,0.28);
  color: rgba(200,149,42,0.7);
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  letter-spacing: 0.18em;
  padding: 12px 28px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.25s;
  display: block;
  margin: 0 auto;
}
.continue-btn:hover { border-color: var(--gold); color: var(--gold); }


/* NARRATIVE ENDING */
.ending {
  animation: emerge .8s ease;
}
.ending-day {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: rgba(200,149,42,0.45);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.ending-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 400;
  color: var(--parch);
  margin-bottom: 26px;
  line-height: 1.2;
  letter-spacing: 0.03em;
}
.ending-body {
  font-size: 1.08rem;
  color: rgba(240,230,200,0.88);
  line-height: 1.9;
  font-weight: 300;
  margin-bottom: 36px;
}
.ending-body p { margin-bottom: 1em; }
.ending-closing {
  font-style: italic;
  font-size: 1.05rem;
  color: rgba(200,149,42,0.65);
  line-height: 2;
  margin: 32px 0;
  text-align: center;
}
.portrait-bridge {
  text-align: center;
  margin: 40px 0 28px;
  padding-top: 32px;
  border-top: 1px solid rgba(200,149,42,0.15);
}
.portrait-bridge p {
  font-style: italic;
  color: rgba(240,230,200,0.4);
  font-size: 0.9rem;
  margin-bottom: 18px;
}
.portrait-reveal-btn {
  background: transparent;
  border: 1px solid rgba(200,149,42,0.35);
  color: rgba(200,149,42,0.7);
  font-family: 'Cinzel', serif;
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  padding: 13px 32px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.3s;
}
.portrait-reveal-btn:hover { border-color: var(--gold); color: var(--gold); }

.watermark {
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 0.5rem;
  color: rgba(200,149,42,0.06);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 48px;
}
</style>
</head>
<body>
<button id="mtoggle" onclick="toggleMusic()">♬ silence</button>
<div id="game"></div>
<script>
// ═══════════════════════════════════════════════════════
// SEED & VARIATION ENGINE
// ═══════════════════════════════════════════════════════
const S = {
  scene: 'intro',
  d: { body:0, mind:0, rel:0, spirit:0 },
  shadows:[], ch:{}, ceremony:false, guideRecognized:false, reactionCount:0,
  seed: {
    days:    [7,8,9,10][Math.floor(Math.random()*4)],
    friend:  ['Marco','Luca','Giulia','Sara','Dario','Elena','Pietro','Mia'][Math.floor(Math.random()*8)],
    clock:   ['02:48','03:07','03:22','03:41','04:03'][Math.floor(Math.random()*5)],
    childWords: [
      '"You look like you\'re carrying something heavy. Are you sure it\'s yours?"',
      '"The light around your forehead is flickering. Did you leave a door open behind you?"',
      '"You walk like someone who thinks they are awake, but is still moving in their sleep."',
      '"They are still singing behind your eyes. Why are you trying to stop the sound?"',
      '"If you give back what you took from the underworld, your shadow will let you pass."'
    ][Math.floor(Math.random()*5)],
    animal: [
      { name:'jaguar',      desc:'It steps from the darkness at the edge of the firelight, tail low, unhurried. It sits three feet from you and does not blink. Its spots are not markings — they are openings.' },
      { name:'condor',      desc:'It is simply there, enormous and still, as if it has always been in this place waiting for you to arrive. Its gaze holds the elevation of thirty thousand feet.' },
      { name:'anaconda',    desc:'It moves from the darkness without hurry, carrying its body with a grace that makes size irrelevant. It coils near the fire. It has been here longer than the jungle.' },
      { name:'hummingbird', desc:'Larger than it should be. Perfectly, impossibly still in the air before you. Its wings do not move. It sees everything at once and judges nothing.' },
      { name:'black puma',  desc:'It materialises from the shadows as if it was made of them. Amber eyes. The quality of its attention is the most complete thing you have ever been subject to.' }
    ][Math.floor(Math.random()*5)],
    temptation: [
      { name:'the name you should not type',    pull:'It sits in the search bar, half-formed. The cursor blinks.' },
      { name:'the drink that blurs the edge',   pull:'The bottle is in the cupboard. You know where.' },
      { name:'the scroll that swallows hours',  pull:'The feed is already open. Time is already gone.' },

// AMBIENT SOUND — organic tones, no chiptune
// ═══════════════════════════════════════════════════════
let AC=null, musicOn=false, currentMood=null, seqInterval=null;
const currentNodes=[];
function getAC(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); return AC; }
function stopMusic(){ if(seqInterval) clearInterval(seqInterval); currentNodes.forEach(n=>{try{n.stop();}catch(e){}}); currentNodes.length=0; }

function playTone(freq, dur, type='sine', gain=0.03, detune=0) {
  if(!musicOn) return;
  const ac=getAC(), o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
  o.type=type; o.frequency.value=freq; o.detune.value=detune;
  f.type='lowpass'; f.frequency.value=600; f.Q.value=0.5;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(gain, ac.currentTime+0.8);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(f); f.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur); currentNodes.push(o);
}

function makeDrone(freq, gain=0.02, detune=0){
  if(!musicOn) return;
  const ac=getAC(), o=ac.createOscillator(), g=ac.createGain(), lfo=ac.createOscillator(), lg=ac.createGain();
  o.type='sine'; o.frequency.value=freq; o.detune.value=detune;
  lfo.type='sine'; lfo.frequency.value=0.12; lg.gain.value=gain*0.3;
  lfo.connect(lg); lg.connect(g.gain);
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.linearRampToValueAtTime(gain, ac.currentTime+3);
  o.connect(g); g.connect(ac.destination);
  o.start(); lfo.start(); currentNodes.push(o); currentNodes.push(lfo);
}

// ─── Evocative ambient audio (real recordings, looped) ───
const MOOD_SRC = {
  jungle:   '/audio/jungle.mp3',
  city:     '/audio/city.mp3',
  ceremony: '/audio/ceremony.mp3',
  guide:    '/audio/guide.mp3',
  insomnia: '/audio/insomnia.mp3'
};
const moodAudioCache = {};
let currentMoodAudio = null;
function getMoodAudio(m){
  if(!moodAudioCache[m]){
    const a = new Audio(MOOD_SRC[m]);
    a.loop = true; a.preload = 'auto'; a.volume = 0;
    moodAudioCache[m] = a;
  }
  return moodAudioCache[m];
}
function fadeAudio(a, from, to, ms, onDone){
  const steps = 20, dt = ms/steps; let i = 0;
  const t = setInterval(()=>{
    i++; a.volume = Math.max(0, Math.min(1, from + (to-from)*(i/steps)));
    if(i>=steps){ clearInterval(t); onDone && onDone(); }
  }, dt);
}
function stopMusic(){
  try { if(seqInterval){ clearInterval(seqInterval); seqInterval=null; } } catch(e){}
  try { currentNodes.forEach(n=>{ try{n.stop();}catch(e){} }); currentNodes.length=0; } catch(e){}
  if(currentMoodAudio){
    const a = currentMoodAudio; currentMoodAudio = null;
    fadeAudio(a, a.volume, 0, 400, ()=>{ try{a.pause();}catch(e){} });
  }
}
const moods = {}; // legacy shape kept for reference
function setMood(m){
  if(!musicOn || m===currentMood) return;
  currentMood = m;
  if(currentMoodAudio){
    const prev = currentMoodAudio;
    fadeAudio(prev, prev.volume, 0, 500, ()=>{ try{prev.pause();}catch(e){} });
  }
  if(!MOOD_SRC[m]) return;
  const a = getMoodAudio(m);
  currentMoodAudio = a;
  a.volume = 0;
  const p = a.play();
  if(p && p.catch) p.catch(()=>{});
  fadeAudio(a, 0, 0.55, 800);
}
function toggleMusic(){
  if(!musicOn){
    musicOn=true; document.getElementById('mtoggle').textContent='♬ sound on';
    const m = currentMood; currentMood = null; setMood(m||'jungle');
  } else {
    musicOn=false; document.getElementById('mtoggle').textContent='♬ silence';
    stopMusic(); currentMood=null;
  }
}

const hasShadow=n=>S.shadows.includes(n);

function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

let somaticBridgeFired = false;
const SOMATIC_PROMPTS = [
  {a:'Place your feet flat on the floor. Feel the weight of your body.',b:'Exhale for four slow counts.',c:'Now — from here — choose.'},
  {a:'Before you act: one hand on your chest. Feel it moving.',b:'Breathe out until the breath is empty.',c:'From this place — choose.'},
  {a:'Your jaw is carrying something. Let it soften slightly.',b:'Three slow breaths. Not to fix anything — just to arrive.',c:'Present — choose.'},
  {a:'Notice where in your body the charge is sitting.',b:'Exhale through the mouth, long and quiet.',c:'Make the choice from here.'},
];
function somaticBridge(html, key) {
  const stress = ['supermarket','traffic','colleague','temptation'];
  if (somaticBridgeFired || !stress.includes(key) || S.shadows.length===0) return html;
  somaticBridgeFired = true;
  const p = SOMATIC_PROMPTS[Math.floor(Math.random()*SOMATIC_PROMPTS.length)];
  const anchor = S.seed.somaticAnchor ? 'You recognise this — the '+S.seed.somaticAnchor+'. Just notice it is there.' : p.a;
  return '<div class="somatic-bridge"><div class="soma-title">◈ before you act</div>'
    +'<div class="soma-text">'+anchor+'<br>'+p.b+'<br><br><em>'+p.c+'</em></div>'
    +'<div class="soma-skip" onclick="this.closest(\'.somatic-bridge\').style.display=\'none\';document.getElementById(\'cw\').style.display=\'flex\';">continue</div>'
    +'</div><div id="cw" style="display:none;flex-direction:column;gap:10px;">'+html+'</div>';
}

// ═══════════════════════════════════════════════════════
function whichOrgan() {
  if (S.guideRecognized && tends('spirit',3)) return {
    name:'the eyes',
    desc:'You hold them up under the fluorescent light. They are clear in a way eyes are not usually clear — the way glass is clear after rain. You see through them into the back of the room, into the parking lot, and further, further. You blink. The world blinks back.',
    why:'You saw what was there to be seen. The guide, the child, the shape of things beneath the shape of things.'
  };
  if (tends('rel',3)) return {
    name:'the throat',
    desc:'It is warm and slightly luminous and smells of mapacho and river. You hold it up. Inside it, like a bell that has just been struck, something is still vibrating gently. The sound it never made is still in there, circling. Now it has been washed, maybe it can.',
    why:'You spoke at least once when you could have swallowed it. The throat remembers.'
  };
  if (S.reactionCount===0 && tends('body',2)) return {
    name:'the jaw',
    desc:'You almost do not recognise it. You have held it so tight for so long — this week, and before this week, and the whole life before this week — that it barely knows what loose feels like. But here, clean, warm from the dryer, it is simply a jaw. It unclenches by itself in your hands.',
    why:'You caught the tightening. More than once. You did not act from it.'
  };
  if (tends('body',3)) return {
    name:'the lungs',
    desc:'They are larger than you expected and very light and when you hold them up they catch the fluorescent light in a way that suggests they have been waiting, for some time, to be given this much air. You breathe in. They expand. The ceremony is still in there, the icaros, the fire, the dark before the dark breaks.',
    why:'You came back to the breath. Again and again this week, you came back.'
  };
  if (S.ceremony) return {
    name:'the heart',
    desc:'It is exactly the size of a fist and it is doing what hearts do, steadily, without drama. But under the light it is different — brighter, or more specific, as if the washing has removed something that was dulling it. You hold it and feel it beat against your palm and you think: this.',
    why:'You went back. The ceremony found you in the night and you went back.'
  };
  // default
  return {
    name:'the stomach',
    desc:'You are not sure what you expected, but not this: warm, quiet, a little embarrassed, like something that has been working very hard without acknowledgement for a long time. You hold it and say, quietly: I know. I know. It seems like the right thing to say.',
    why:'It held everything this week that had nowhere else to go. It held it without complaint.'
  };
}


function whichOrgan() {
  if (S.guideRecognized && S.d.spirit >= 3)
    return { name:'eyes', desc:'clear in a way they were not before — as if something has been removed from in front of them', why:'You recognized what was looking back at you.' };
  if (S.d.rel >= 3)
    return { name:'throat', desc:'humming faintly, like a string that has been plucked and not yet silenced', why:'You met people this week. Not performed meeting — actual contact.' };
  if (S.reactionCount === 0 && S.d.body >= 2)
    return { name:'jaw', desc:'completely soft — for the first time in years, the jaw is completely soft', why:'Nothing tightened this week and stayed tight.' };
  if (S.d.body >= 3)
    return { name:'lungs', desc:'enormous — they fill the entire drum, pressing gently against the glass, slow and vast', why:'You kept breathing when breathing was the practice.' };
  if (S.ceremony)
    return { name:'heart', desc:'the colour of jungle at 4am, still warm, still beating its own particular time', why:'The ceremony touched it again in the night.' };
  return { name:'stomach', desc:'patient and luminous — it knows exactly what it has been asked to hold', why:'You carried more than you knew this week.' };
}

       echo:'<p>The mask goes on before you decide to wear it. You hear yourself asking about the neighbours, the garden, the car. You are excellent at this.</p><p>Somewhere inside, very quietly, something that came back from the jungle observes this performance with an expression you cannot read.</p>',
       tags:{rel:1,spirit:-1},sh:'The Mask-Wearer',nx:'supermarket',id:2},
      {t:'Excuse yourself early. The floor of your old bedroom.',
       echo:'<p>Your childhood bed is too soft. You take the blanket to the floor and lie flat, arms open, feeling the house settle around you.</p><p>You breathe. The ceremony breathes with you. This will have to be enough for tonight.</p>',
       tags:{body:1},sh:null,nx:'supermarket',id:3}
    ])
  },

  supermarket: {
    mood:'city',label:'DAY THREE · FIRST TEST',
    get title(){ return 'The '+S.seed.queueScene[0].toUpperCase()+S.seed.queueScene.slice(1); },
    art:'supermarket',
    body:()=>'<p>The queue is long. You wait with six items. The person ahead has a complicated transaction that is completely stalled. The people behind you shift their weight.</p>'
      +'<div class="jmirror">Something tightens in your jaw. You notice you are already somewhere else in your head — a story about your time, about this person you do not know.</div>'
      +(hasShadow('The Mask-Wearer')?'<div class="mecho">At dinner you performed patience. Here, with strangers, the performance is not available. This is what you actually are.</div>':'')
      +'<p>The person ahead is visibly mortified. The cashier\'s face is blank. Eight people wait.</p>',
    choices:()=>shuffle([
      {t:'Stay with the breath. Wait.',
       echo:'<p>The tightening in your jaw does not disappear. But you stop feeding it. You stand there, a human being in a queue, breathing, while another human being tries to locate money in a bag that contains everything except money.</p><p>The person behind you sighs. You feel the sigh land, and you do not join it. Eventually the queue moves.</p>',
       tags:{body:1,spirit:1},sh:null,nx:'traffic',id:0},
      {t:'Step forward. Offer to cover the difference.',
       echo:'<p>You hear yourself say it before you decide to: "I can cover it — please, it\'s fine." The cashier looks at you. The woman looks at you.</p><p>She accepts. She cannot look at you while she accepts. In the car park she will try to find you to pay you back. She will not be able to. This is fine.</p>',
       tags:{rel:1,spirit:1},sh:null,nx:'traffic',id:1},
      {t:'Move to another queue.',
       echo:'<p>You pick up your basket and move three metres to the left. The frustration goes nowhere in particular — it becomes part of the ambient texture of the afternoon.</p><p>From here you can see the woman\'s shoulders. Still tight. Still mortified. You look away.</p>',
       tags:{mind:1},sh:null,nx:'traffic',id:2},
      {t:'Sigh. Loudly enough.',
       echo:'<p>The sound escapes before you fully choose it. The woman hears it — her shoulders tighten fractionally.</p><p>A half-second of satisfaction, clean and sharp. Then the shame: you have just used your exhale as a weapon against someone who was already having a bad day.</p><p>You stare at the chewing gum display for the remaining minutes.</p>',
       tags:{rel:-1},sh:'The Reactor',nx:'traffic',id:3}
    ])
  },

  traffic: {
    mood:'city',label:'DAY THREE · SECOND TEST',title:'The Friction',art:'traffic',
    body:()=>'<p>You are ten minutes from home. Something blocks the path — someone frozen, oblivious, in the way.</p>'
      +'<div class="jmirror">The reaction is right there. And with it, the whole familiar architecture: the certainty that you are right, that they are wrong, that the anger is justified.</div>'
      +(S.reactionCount>0?'<div class="mecho">It is the second time today the old circuitry has run. The jungle showed you this exact wiring. You are watching it.</div>':'')
      +'<div class="jmirror">Behind the anger, if you look: you are tired. You want to be home. This person is simply the nearest available explanation for that.</div>',
    choices:()=>shuffle([
      {t:'Wait. Notice what is underneath.',
       echo:'<p>You wait. In those seconds you find, beneath the irritation: you are tired, you have been carrying something heavy all week, and you want to be home in a way that has nothing to do with this person.</p><p>The path clears. You go home.</p>',
       tags:{body:1,spirit:1},sh:null,nx:'child_guide',id:0},
      {t:'Signal once. Just a notification.',
       echo:'<p>One brief signal. The person startles, looks up, moves. They wave a small apology at no one in particular.</p><p>You move past them. You feel approximately nothing, which is itself a kind of progress.</p>',
       tags:{mind:1},sh:null,nx:'child_guide',id:1},
      {t:'React.',
       echo:'<p>The reaction comes out full — more than you intended. The person startles badly. You drive away feeling, for two seconds, justified. Then the two seconds end.</p><p>For the rest of the drive you are explaining yourself to no one, in your head, in a car alone.</p>',
       tags:{rel:-1},sh:'The Reactor',nx:'child_guide',id:2},
      {t:'Take a different way home entirely.',
       echo:'<p>You turn off before the obstruction and take the longer road — past the canal, the way you used to go. It takes twelve extra minutes. The light on the canal is something. You had forgotten about the canal.</p>',
       tags:{body:1},sh:null,nx:'child_guide',id:3}
    ])
  },

  child_guide: {
    mood:'guide',label:'DAY THREE · THE ENCOUNTER',title:'The Child at the Corner',art:'child_guide',
    body:()=>{
      const reactive=S.reactionCount>=2;
      return '<p>You stop at the corner shop for something small. On the step outside, a child — maybe seven, maybe eight — is sitting alone, watching the street with an attention that seems too still for her age.</p>'
        +(reactive?'<div class="jmirror">You are still carrying the residue of today. You almost walk past her. But some small remaining thread of the ceremony slows your step.</div>'
          :'<div class="mecho">The day has been quiet inside you, mostly. Something about that quiet lets you actually see her. She is very still.</div>')
        +'<p>As you pass, she looks directly up at you — without the usual social hesitation of children with strangers — and says:</p>'
        +'<div class="guide-text">'+S.seed.childWords+'</div>'
        +'<p>Then she looks back at the street, as if she said nothing unusual. The shopkeeper inside has not looked up. No one else seems to have heard.</p>'
        +'<div class="vis">Something stops time for a half-second. You know this feeling — the sudden stillness of ceremony when something true is spoken into a room. The child\'s eyes, in that brief moment, held something very old.</div>'
        +'<p>You are standing on a pavement outside a corner shop in ordinary daylight. And something just opened.</p>';
    },
    choices:()=>[
      {t:'Stop. Crouch down to her level. Say: "You might be right. Thank you."',
       echo:'<p>She nods, completely unsurprised, as if she expected nothing less. Then she looks back at the street.</p><p>You stand up. You go into the shop. You buy what you came for. On the way out she is gone — not dramatically, just gone, the way things go in ceremony when they are finished with you.</p>',
       tags:{spirit:2,rel:1},sh:null,nx:'colleague',isGuide:true},
      {t:'Smile, genuinely moved, and keep walking.',
       echo:'<p>The words stay with you the whole afternoon. You turn them like a stone you found on a path: smooth on one side, rough on the other, heavier than it looks.</p>',
       tags:{spirit:1,mind:1},sh:null,nx:'colleague',isGuide:true},
      {t:'Stop. Ask her name, her age, whether she is waiting for someone.',
       echo:'<p>She answers each question patiently, as if she has all the time there is. Something passed between you anyway, through the ordinary exchange. She does not explain herself further. Neither do you.</p>',
       tags:{rel:1,spirit:1},sh:null,nx:'colleague',isGuide:true},
      {t:'Laugh softly and go into the shop.',
       echo:'<p>"Kids, huh?" you say to no one in particular. The door closes. The moment closes with it.</p><p>You buy what you came for. On the way out the step is empty.</p>',
       tags:{mind:1},sh:null,nx:'colleague'}
    ]
  },

  colleague: {
    mood:'city',label:'DAY FIVE · THIRD TEST',title:'The Credit',art:'colleague',
    body:()=>'<p>Thursday meeting. Your manager presents the proposal. The slides are yours — built over three evenings. Your colleague nods along as if he had some role in it. Afterward he is praised specifically. He accepts the praise without correction.</p>'
      +(S.guideRecognized?'<div class="mecho">The child asked if what you carry is yours. This anger — is it yours? Or is it the old story about not being seen, dressed in fresh clothes?</div>'
        :'<div class="jmirror">The unfairness is real. And beneath it, something older: the fear that if you do not claim what is yours, it will be taken.</div>')
      +'<p>After the meeting he finds you at the coffee machine and says, cheerfully: "Great proposal by the way."</p>'
      +'<div class="vis">You see his energy. It is not malicious. He genuinely does not know what he did. This does not make it acceptable. But it changes something about what the correct response is.</div>',
    choices:()=>shuffle([
      {t:'"I built that proposal. I\'d appreciate it if you mentioned that to Sarah."',
       echo:'<p>Calm. Specific. He looks at you for a moment with an expression you cannot entirely read. Then: "Oh. Yeah. Of course. I didn\'t mean to — I\'ll talk to her."</p><p>You do not know if he will. But you said the thing. The thing has been said.</p>',
       tags:{rel:1,mind:1},sh:null,nx:'friend',id:0},
      {t:'Say nothing here. Book time with the manager directly.',
       echo:'<p>"Thanks," you say, and mean nothing by it. You take out your phone and send your manager a message asking for fifteen minutes.</p><p>She responds immediately: tomorrow at 3. You put your phone away. The anger has somewhere to go now. It becomes something more like preparation.</p>',
       tags:{mind:1},sh:null,nx:'friend',id:1},
      {t:'"Thanks." Let it go.',
       echo:'<p>He smiles back, satisfied, and returns to the office. The anger does not leave. It has nowhere to go, so it finds a place to live — somewhere between your shoulder blades, low and persistent. It will be there at dinner. It will be there tomorrow.</p>',
       tags:{rel:1,spirit:-1},sh:'The Swallower',nx:'friend',id:2},
      {t:'"I know. I wrote it."',
       echo:'<p>He holds the air between you for a moment — a fraction longer than is comfortable — then nods once and walks back down the corridor.</p><p>Nothing has been resolved. But something has been placed correctly, and you feel its weight settle into its proper position.</p>',
       tags:{rel:1,spirit:1},sh:null,nx:'friend',id:3}
    ])
  },

  friend: {
    mood:'city',label:'DAY FOUR · THE MIRROR',
    get title(){ return S.seed.friend; },
    art:'friend',
    body:()=>'<p>'+S.seed.friend+' has known you since you were seventeen. Two drinks in, telling a story about work. '+S.seed.friend+' asks what the jungle was like. "Intense?" they offer, smiling.</p>'
      +(chose('homecoming',2)?'<div class="mecho">You did it again at dinner. You notice yourself checking: is it happening now too?</div>':'')
      +(S.guideRecognized?'<div class="mecho">The child\'s question is still somewhere in you. What are you carrying into this room, into this friendship?</div>':'')
      +'<div class="vis">Two people: the friend you love, and a ghost version of you — the one you might have become. The ghost sits comfortably in the chair. It orders another round. It is not unhappy.</div>'
      +'<p>"You seem different," '+S.seed.friend+' says. Not a compliment, not a criticism. An observation, delivered with slight wariness.</p>',
    choices:()=>shuffle([
      {t:'"I am different. I don\'t fully know how yet."',
       echo:'<p>You meet their eyes. You do not explain further. '+S.seed.friend+' seems to consider pressing — and then decides not to. "Well," they say. "You seem good."</p><p>It is not quite right, but it is kind. You let it be kind.</p>',
       tags:{rel:1,spirit:1},sh:null,nx:'laundromat',id:0},
      {t:'Deflect. Become whoever the room needs.',
       echo:'<p>You pull their story toward you and inhabit it perfectly. '+S.seed.friend+' relaxes into the conversation like a person taking off a coat.</p><p>On the way home you will not be entirely sure what you said. The evening will feel both successful and slightly hollow.</p>',
       tags:{rel:1,spirit:-1},sh:'The Mirror',nx:'laundromat',id:1},
      {t:'Order water. Your body does not want the drink.',
       echo:'<p>You push the glass aside. '+S.seed.friend+' raises an eyebrow. "Still detoxing?"</p><p>"Something like that." At some point you notice you are more present than usual. '+S.seed.friend+' does not comment. But they lean forward more than they usually do.</p>',
       tags:{body:1},sh:null,nx:'laundromat',id:2},
      {t:'Excuse yourself. Breathe through it alone.',
       echo:'<p>The thing — grief, irritation, you cannot tell — moves through you in ninety seconds. Then it is gone. You rinse your face. You go back out. '+S.seed.friend+' is looking at their phone and does not look up as you sit down, which is exactly what you needed.</p>',
       tags:{body:1,mind:1},sh:null,nx:'laundromat',id:3}
    ])
  },

  laundromat: {
    mood:'city', label:'DAY FIVE · EVENING · THE LAUNDROMAT', title:'The Laundromat of the Soul', art:'laundromat',
    body:()=>{
      const o=whichOrgan();
      const parts=[];
      parts.push('<p>You needed to do laundry. This is not symbolic. The laundry genuinely needed doing.</p>');
      parts.push('<p>The laundromat is open until midnight. It is 10pm. You are the only one here.</p>');
      parts.push('<p>You load the machine. In go the clothes from the week. The drum begins to turn.</p>');
      parts.push('<p>You sit down on the plastic bench to wait. And then, without any particular warning, you notice what is in the machine.</p>');
      parts.push('<div class="vis">It is not the clothes.</div>');
      parts.push('<div class="vis">It is your heart. Turning slowly, pressed against the porthole glass, trailing its valves. Then your lungs — both of them, enormous and grey-pink, folding and unfolding in the warm water. Your liver, your kidneys, your intestines coiling in the suds. Your throat — the one that has never spoken as clearly as you needed it to — spiralling in the foam like something dredged from deep water.</div>');
      parts.push('<p>You look around. There is no one else here. The vending machine hums.</p>');
      parts.push('<p>The machine runs its full cycle. The water keeps changing colour. Eventually it runs clear. The machine beeps. The drum slows. You open the door.</p>');
      parts.push('<div class="guide-text">One of them is shining. The '+o.name+': '+o.desc+'.</div>');
      parts.push('<div class="mecho">'+o.why+'</div>');
      parts.push('<p>You put everything back carefully, without haste. You move the load to the dryer. You sit back down.</p>');
      parts.push('<p>On your phone: a review for this laundromat. ★★★★ <em>Changed my life.</em> — M. Fontana, fourteen months ago.</p>');
      parts.push('<p>You type yours: ★★★★★ <em>The machines are reliable. I would say more but I am not sure I have the language yet.</em> You post it.</p>');
      parts.push('<p>You wait for the dryer. The light in here is very steady and very ordinary and you are, for no reason you can fully defend, completely fine.</p>');
      return parts.join('');
    },
    choices:()=>[
      {t:'Hold your heart carefully, like something that has survived a long crossing.',
       echo:'<p>It is warm. Heavier than expected. You hold it for a moment before placing it back. It slots in with a small definitive click, like a key finding its lock. You sit back down. The dryer turns. The city continues its business, entirely unaware that something just happened in here.</p>',
       tags:{body:1,spirit:1},sh:null,nx:'temptation'},
      {t:'Hold your throat up to the light. Try to see through it.',
       echo:'<p>It is translucent in a way you did not expect. You can see the shape of things that passed through it and things that did not — words spoken clearly and ones that went back down. You study it for a long moment. Then you put it back gently, like a correction that has finally been made.</p>',
       tags:{spirit:1,rel:1},sh:null,nx:'temptation'},
      {t:'Laugh. Because this is genuinely funny.',
       echo:'<p>You start laughing — the involuntary kind, from behind the sternum, which has just been washed and is still slightly damp. The fluorescent light does not react. The vending machine does not react. You laugh until your eyes water, sitting alone in the laundromat at 10pm holding your own clean organs.</p><p>When you stop, you feel lighter than you have in a week. You put everything back. The dryer turns.</p>',
       tags:{body:1,mind:1},sh:null,nx:'temptation'},
      {t:'Sit quietly and hold each one in turn.',
       echo:'<p>Heart, lungs, liver, throat, the stomach that has been clenching since Tuesday. You hold each one for a moment — not trying to fix anything, just letting it know you are paying attention. When they are all back in place, you feel different. Not healed. Not resolved. Just attended to. Which turns out to be something.</p>',
       tags:{body:1,spirit:1},sh:null,nx:'temptation'}
    ]
  },

  temptation: {
    mood:'insomnia',label:'DAY SIX · THE DESCENT',title:'The Spirit of the Old Pattern',art:'temptation',
    body:()=>'<p>11pm. Alone. The pull: '+S.seed.temptation.name+'. '+S.seed.temptation.pull+'</p>'
      +(hasShadow('The Reactor')?'<div class="shv">The reactions this week were real. The pattern knows where the cracks are. It has been watching.</div>':'')
      +(S.guideRecognized?'<div class="mecho">The child asked what you are carrying. This pull — how long have you been carrying it? Did you choose it, or did it choose you?</div>':'')
      +'<div class="vis">It stands in the corner. Not monstrous — beautiful, almost. Ancient, patient eyes. In ceremony you saw it, named it, wept with it. It has waited patiently for your return.</div>'
      +'<div class="shv">"You cannot sustain this," it says quietly. "You know what you are. Come back."</div>',
    choices:()=>[
      {t:'Say its name out loud. Sit with it.',
       echo:'<p>You say the name in the empty room. It sounds smaller than it feels. You sit with it the way you sat with things in ceremony: without trying to change them.</p><p>The pull does not leave. But it loses a dimension. It becomes a thing you are watching. You sit there for a while. Then you make tea.</p>',
       tags:{spirit:1,mind:1},sh:null,nx:'insomnia'},
      {t:'Write it. The pull, the shape, what it promises.',
       echo:'<p>You open the journal. You write: <em>it is here again.</em> Then what it feels like, what it offers, what you know about its cost. The writing does not make it disappear. But it makes it legible.</p><p>You write for twenty minutes. At the end you draw a thin line under the last sentence. For tonight, you do not act.</p>',
       tags:{mind:1},sh:null,nx:'insomnia'},
      {t:'Give in. Partially. Enough to take the edge off.',
       echo:'<p>You tell yourself this is also integration. These are true things. They are also the things the pattern has learned to whisper to sound reasonable.</p><p>Afterward, the edge is off. Something else has taken its place — a thin, familiar emptiness you know how to live with, because you have been living with it for years.</p>',
       tags:{body:1,spirit:-1},sh:'The Negotiator',nx:'insomnia'},
      {t:'Call someone.',
       echo:'<p>A friend who picks up late, who does not ask why, who simply begins talking about their week. Their voice fills the room. The pull retreats to the edge where it waits, patient, for another opening.</p><p>You talk for half an hour. You do not mention what you were about to do. You do not need to.</p>',
       tags:{rel:1},sh:null,nx:'insomnia'}
    ]
  },

  insomnia: {
    mood:'insomnia',
    get label(){ return 'DAY SIX · '+S.seed.clock+' · THE CEILING'; },
    title:'What the Dark Asks',art:'insomnia',
    body:()=>'<p>'+S.seed.clock+'. The room is dark. You are awake staring at the ceiling. This is the part nobody puts in the retreat brochures.</p>'
      +(chose('temptation',2)?'<div class="shv">The giving-in has not helped. The emptiness it left is louder than the craving was.</div>':'')
      +((chose('temptation',0)||chose('temptation',1))?'<div class="mecho">You held last night. Something noticed. The room has a slightly different quality.</div>':'')
      +'<div class="vis">The ceiling is not blank. You can still see — faintly — the serpent. Patient as water. It traces the same line across the plaster, and then it turns its head.</div>'
      +'<p>A single eye, the colour of jungle canopy, finds yours. Something like an invitation moves through the dark of the room.</p>'
      +(S.guideRecognized?'<div class="mecho">The child. The ceremony. The serpent now. The same current, different forms. Something is trying to reach you through every available opening.</div>':''),
    choices:()=>[
      {t:'Close your eyes. Follow the serpent back.',
       echo:'<p>You close your eyes. You release the room — the ceiling, the clock, the weight of the week. The serpent moves. You move with it. The distance between here and the maloca folds, the way water folds around a stone, and —</p>',
       tags:{spirit:2},sh:null,nx:'ceremony',isCeremony:true},
      {t:'Lie still. Let the dark ask.',
       echo:'<p>You lie there. The dark asks. You do not answer. This is its own kind of conversation — the kind where staying in the room together is the point.</p><p>At some point the quality of the darkness changes. Dawn is arriving somewhere else first.</p>',
       tags:{spirit:1,body:1},sh:null,nx:'practice'},
      {t:'Get up. Make tea. Write until the light comes.',
       echo:'<p>The kitchen is cold. Standing in it in the dark at this hour feels — briefly, strangely — like exactly the right place to be.</p><p>You write until the window begins to separate from the wall. Three pages. You do not know what they say yet. That is for later.</p>',
       tags:{mind:1,spirit:1},sh:null,nx:'practice'},
      {t:'Body scan. Feet upward. Let sleep find you.',
       echo:'<p>Feet. Ankles. Calves. The knee that always carries more than it admits. The hips. The belly. The chest —</p><p>You do not reach the chest.</p>',
       tags:{body:1},sh:null,nx:'practice'}
    ]
  },

  ceremony: {
    mood:'ceremony',label:'NIGHT · THE RETURN WITHIN THE RETURN',title:'The Jungle Finds You in Your Bed',art:'ceremony',artCls:'cere',isCere:true,
    body:()=>'<div class="ctext">The ceiling dissolves. The serpent folds the distance between your room and the maloca into nothing, the way water folds around a stone.</div>'
      +'<div class="ctext">You are in the ceremony. The fire is still burning. The icaros still move through the air. '+S.seed.shamanText+'</div>'
      +'<p style="color:#7adab8;">And then your animal guide steps from the darkness at the edge of the firelight.</p>'
      +'<div class="ctext">'+S.seed.animal.desc+'</div>'
      +'<div class="ctext">In the guide\'s gaze you see the week laid out — not as memory, but as landscape. You see the patterns from outside: where you contracted, where something moved through freely.</div>'
      +'<div class="ctext">Then the guide moves toward you and places something against your chest. Not a paw, not a wing. Something that has no shape in ordinary language. But you feel it land. And you recognise it — it is the thing you almost discarded this week. The guide gives it back as if it is the most important object in the room.</div>'
      +(S.guideRecognized?'<div class="ctext">The guide shows you one more thing: the child on the step. These openings come in every form. The question is only whether you are moving fast enough to miss them.</div>'
        :'<div class="ctext">The guide shows you other moments along the map of your week — possible openings. Not accusation. Just information.</div>'),
    choices:()=>[
      {t:'Ask the guide what it placed in your chest.',
       echo:'<div class="ctext">It looks at you for a long moment. Then it shows you: it is your own attention. The full, undefended kind. You had been rationing it all week. The guide returns the unrationed version. It is the only thing that was ever actually yours.</div>',
       tags:{spirit:2,mind:1},sh:null,nx:'ceremony_return',isCeremony:true},
      {t:'Sit in the firelight. Let the guide finish its work.',
       echo:'<div class="ctext">When it is done, something in you is quieter than it has been in years. Not empty — settled.</div>',
       tags:{spirit:2,body:1},sh:null,nx:'ceremony_return',isCeremony:true},
      {t:'Show the guide the week — the queue, the friction, the night.',
       echo:'<div class="ctext">The guide looks at each one without flinching. Then it shows you what you did right. The list is longer than you thought.</div>',
       tags:{spirit:1,mind:1},sh:null,nx:'ceremony_return',isCeremony:true},
      {t:'Ask the guide what the ceremony is trying to do with your life.',
       echo:'<div class="ctext">The fire leaps. The shaman smiles without looking up. The guide walks back into the darkness. But as it goes, you understand: the ceremony is not doing something to your life. It is asking you to do something with it.</div>',
       tags:{spirit:2},sh:null,nx:'ceremony_return',isCeremony:true}
    ]
  },

  ceremony_return: {
    mood:'ceremony',label:'NIGHT · CROSSING BACK',
    get title(){ return S.seed.clock+' — Still'; },
    art:'ceremony_return',artCls:'cere',isCere:true,
    body:()=>{
      const msgs=[
        'Your attention. That was what the guide gave back. The full kind — the kind you give to something you love. You had been rationing it all week. The guide returned the unrationed version. It is the only thing that was ever actually yours.',
        'You were seen completely. Not assessed, not advised — witnessed. Nothing needed to change. You were simply, fully, looked at. It turns out this is what you had been hungry for beneath every other hunger.',
        'The queue, the traffic, the colleague — from outside they look like exactly what they are: patterns running themselves through available circumstances. You were not failing. You were inside the pattern. From here you can see it has edges.',
        'The ceremony is not doing something to your life. It is asking you to do something with it. The fire said it. The guide walked away rather than explain further, because explanation would have made it smaller.'
      ];
      const c=S.ch['ceremony']||0;
      return '<div class="ctext">And then you are back. The ceiling is the ceiling. The clock reads '+S.seed.clock+'. Not a minute has passed.</div>'
        +'<div class="ctext">'+msgs[c]+'</div>'
        +'<p style="color:#7adab8;">The room is different. You are different, again, in a different way.</p>';
    },
    choices:()=>[
      {t:'Stay with it. Let the gift settle.',
       echo:'<div class="ctext">You do not move, do not write. You let it settle like sediment. The room holds you. The night holds the room.</div>',
       tags:{spirit:1,body:1},sh:null,nx:'practice',isCeremony:true},
      {t:'Reach for the journal. Write in the dark.',
       echo:'<div class="ctext">The words are imperfect. They are as close as language can get to what just happened.</div>',
       tags:{mind:1,spirit:1},sh:null,nx:'practice',isCeremony:true},
      {t:'Place your hand on your heart. Make one silent promise.',
       echo:'<div class="ctext">To the guide. To the jungle. To yourself. The promise is specific. The room witnesses it.</div>',
       tags:{spirit:2},sh:null,nx:'practice',isCeremony:true},
      {t:'Fall asleep the way children sleep after they have cried.',

function getArchetypeResult(){
  const qualified=ARCHETYPES
    .filter(a=>a.condition(S.d))
    .sort((a,b)=>ARCHETYPE_RANK.indexOf(a.id)-ARCHETYPE_RANK.indexOf(b.id));
  const nonFallback=qualified.filter(a=>a.id!=='crossing');
  if(!nonFallback.length){
    return {primary:ARCHETYPES.find(a=>a.id==='crossing'),ascendant:null};
  }
  return {primary:nonFallback[0],ascendant:nonFallback[1]||null};
}

function dlvl(v){ return v<=1?'low':v<=2?'mid':'high'; }

  const result = getArchetypeResult();
  const arch = result.primary;

function startGame() {

  document.getElementById('mtoggle').textContent = '\u266c sound on';
  if (ac.state === 'suspended') ac.resume();
  go('airport');

let pendingNext = null;

function choose(scKey, choiceId) {
  const sc = SCENES[scKey];
  const raw = typeof sc.choices==='function' ? sc.choices() : sc.choices;
  const ch = raw.find(c => typeof c.id!=='undefined' ? c.id===choiceId : raw.indexOf(c)===choiceId);
  Object.entries(ch.tags).forEach(([d,v])=>{ S.d[d]=Math.max(-2,(S.d[d]||0)+v); });
  if(ch.sh) S.shadows.push(ch.sh);
  S.ch[scKey] = choiceId;
  if(ch.sh==='The Reactor') S.reactionCount++;
  if(ch.isGuide) S.guideRecognized=true;
  if(sc.isCere||ch.isCeremony) S.ceremony=true;
  if(ch.echo) { pendingNext=ch.nx; showConsequence(ch.t,ch.echo,ch.nx,sc); }
  else go(ch.nx);
}

function showConsequence(actionText,echoText,nextScene,sc) {
  const isCere=sc.isCere||false;
  const sub=isCere?'the ceremony within the return':'a mythic journey of integration';
  document.getElementById('game').innerHTML = '<div class="gh"><div class="gt">THE RETURN</div><div class="gs">'+sub+'</div></div>'
    + dbar()
    + '<div class="scene consequence"><div class="slabel">'+(sc.label||'')+'</div>'
    + art(sc.art||S.scene,sc.artCls||'')
    + '<div class="chosen-action">'+actionText+'</div>'
    + '<div class="echo-text">'+echoText+'</div>'
    + '<button class="continue-btn" onclick="go(\''+nextScene+'\')">continue</button></div>'
    + '<div class="watermark">'+S.seed.sessionID+' \u00b7 '+S.seed.animal.name+'</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(id){ S.scene=id; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function restart(){ window.location.reload(); }

function dbar(){
  if(S.scene==='intro') return '';
  const meta={body:{label:'the vessel',desc:'how you are living in your body'},mind:{label:'the witness',desc:'how you are processing and naming'},rel:{label:'relating',desc:'how you are meeting others'},spirit:{label:'the thread',desc:'how you are holding the invisible'}};
  return '<div class="dbar">'+Object.entries(S.d).map(([k,v])=>{
    const cls=v>=3?'deep':v>=1?'on':''; const m=meta[k];
    return '<div class="dp '+cls+'" title="'+m.desc+'">'+m.label+'</div>';
  }).join('')+'</div>';
}

function render() {
  const game=document.getElementById('game');
  const sc=SCENES[S.scene];
  setMood(sc.mood||'city');
  if(sc.render){
    game.innerHTML='<div class="gh"><div class="gt">THE RETURN</div><div class="gs">a mythic journey of integration</div></div>'
      +art('intro','')+'<div class="scene">'+sc.render()+'</div>'
      +'<div class="watermark">'+S.seed.sessionID+' \u00b7 '+S.seed.animal.name+'</div>';
    return;
  }
  if(sc.isEnd){ renderEnding(); return; }
  const body=typeof sc.body==='function'?sc.body():sc.body;
  const isCere=sc.isCere||false;
  const raw=typeof sc.choices==='function'?sc.choices():sc.choices;
  const rawChHTML=raw.map((c,i)=>{
    const tid=typeof c.id!=='undefined'?c.id:i;
    const cls=isCere?' cere':(typeof sc.label==='string'&&sc.label.includes('ENCOUNTER'))?' guide':'';
    return '<button class="cb'+cls+'" onclick="choose(\''+S.scene+'\','+tid+')"><span class="ck">'+['i','ii','iii','iv'][i]+'</span>'+c.t+'</button>';
  }).join('');
  const chHTML=somaticBridge(rawChHTML,S.scene);
  const title=typeof sc.title==='function'?sc.title():sc.title;
  const label=typeof sc.label==='function'?sc.label():sc.label;
  const sub=isCere?'the ceremony within the return':(sc.label&&sc.label.includes('ENCOUNTER'))?'the accidental guide':'a mythic journey of integration';
  game.innerHTML='<div class="gh"><div class="gt">THE RETURN</div><div class="gs">'+sub+'</div></div>'
    +dbar()+'<div class="scene"><div class="slabel">'+(label||'')+'</div>'
    +art(sc.art||S.scene,sc.artCls||'')
    +'<div class="stitle">'+title+'</div>'
    +'<div class="sbody">'+body+'</div>'
    +'<div class="sigil">'+(isCere?'\u2726':'\u00b7')+'</div>'
    +'<div class="choices">'+chHTML+'</div></div>'
    +'<div class="watermark">'+S.seed.sessionID+' \u00b7 '+S.seed.animal.name+'</div>';
}

// Floating ember particles
for(let i=0;i<14;i++){
  const p=document.createElement('div');
  p.className='ember-particle';
  p.style.cssText='left:'+Math.random()*100+'vw;width:'+(1+Math.random()*2)+'px;height:'+(1+Math.random()*2)+'px;background:'+(Math.random()>.6?'rgba(200,149,42,0.5)':'rgba(74,154,122,0.4)')+';animation-duration:'+(14+Math.random()*22)+'s;animation-delay:'+(Math.random()*18)+'s;';
  document.body.appendChild(p);
}

if(window.JOURNAL_PROFILE){
  const P=window.JOURNAL_PROFILE;
  if(P.friction_scenario)  S.seed.queueScene=P.friction_scenario;
  if(P.old_pattern_label)  S.seed.temptation={name:P.old_pattern_label,pull:P.old_pattern_desc||''};
  if(P.friend_scene_person) S.seed.friend=P.friend_scene_person;
  if(P.unresolved_thread)  S.seed.unresolvedThread=P.unresolved_thread;
  if(P.shadow_hint)        S.shadows.push(P.shadow_hint);
  if(P.somatic_anchor)     S.seed.somaticAnchor=P.somatic_anchor;
}

render();

</script>
</body>
</html>
