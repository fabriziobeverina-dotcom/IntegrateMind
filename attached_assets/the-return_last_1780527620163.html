<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE RETURN</title>
<style>
:root {
  --bg-color: #020204;
  --text-color: #ffffff;
  --blood: #ff2a2a;
  --gold: #ffb703;
  --spirit: #00f5d4;
  --shadow: #111217;
  --arcade-blue: #0022ff;
  --g3: #475569;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
body {
  background: var(--bg-color);
  color: var(--text-color);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.5s ease, color 0.5s ease;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%);
  background-size: 100% 4px;
  pointer-events: none;
  z-index: 999;
}
#game {
  position: relative;
  z-index: 2;
  max-width: 660px;
  margin: 0 auto;
  padding: 28px 20px 90px;
}
.gh {
  text-align: center;
  margin-bottom: 26px;
  padding-bottom: 16px;
  border-bottom: 4px double var(--g3);
}
.gt {
  font-size: clamp(1.8rem, 6vw, 3rem);
  letter-spacing: 0.1em;
  color: var(--gold);
  text-shadow: 4px 4px 0px #000;
  font-weight: 900;
  margin-bottom: 3px;
  text-transform: uppercase;
}
.gs {
  color: rgba(255, 255, 255, 0.5);
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 600;
}
.art-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}
.art-wrap svg {
  width: 100%;
  max-width: 512px;
  height: auto;
  display: block;
  border: 4px solid var(--arcade-blue);
  background: #000;
  box-shadow: 0 8px 0px #000;
}
.art-wrap.cere svg {
  border-color: var(--spirit);
  box-shadow: 0 0 20px rgba(0,245,212,0.4), 0 8px 0px #000;
}
.art-wrap.guide svg {
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(255,183,3,0.4), 0 8px 0px #000;
}
.dbar {
  display: flex;
  gap: 6px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.dp {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 4px 10px;
  border: 2px solid #334155;
  color: rgba(255, 255, 255, 0.3);
  text-transform: uppercase;
  border-radius: 4px;
}
.dp.on {
  border-color: var(--blood);
  color: var(--text-color);
  background: rgba(255,42,42,0.25);
}
.dp.deep {
  border-color: var(--spirit);
  color: var(--spirit);
  background: rgba(0,245,212,0.15);
}
.scene { animation: fi .3s ease-out; }
@keyframes fi {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.slabel {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.stitle {
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 800;
  color: var(--text-color);
  margin-bottom: 18px;
  line-height: 1.2;
}
.sbody {
  font-size: 1.05rem;
  color: rgba(255, 255, 255, 0.9);
  margin-bottom: 24px;
}
.sbody p { margin-bottom: 1em; }
.vis { color: var(--spirit); padding-left: 15px; border-left: 4px solid var(--spirit); margin: 18px 0; font-weight: 500; }
.shv { color: var(--blood); padding-left: 15px; border-left: 4px solid var(--blood); margin: 18px 0; font-weight: 700; }
.mecho { color: var(--gold); padding-left: 15px; border-left: 4px solid var(--gold); margin: 18px 0; font-weight: 500; }
.ctext { color: #a0f5d4; padding-left: 15px; border-left: 4px dashed var(--spirit); margin: 18px 0; }
.jmirror { color: #cbd5e1; padding-left: 15px; border-left: 4px dotted #ffb703; margin: 18px 0; }
.guide-text { color: #fffbda; padding-left: 15px; border-left: 4px double var(--gold); margin: 18px 0; font-weight: 700; }
.choices { display: flex; flex-direction: column; gap: 12px; }
.cb {
  background: #16171e;
  border: 2px solid #475569;
  color: var(--text-color);
  font-size: 1rem;
  font-weight: 600;
  padding: 16px;
  text-align: left;
  cursor: pointer;
  line-height: 1.4;
  box-shadow: 4px 4px 0px #000;
  border-radius: 6px;
}
.cb:hover { border-color: var(--gold); color: var(--gold); background: #090a0f; }
.cb:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
.cb .ck { color: var(--gold); margin-right: 12px; font-weight: 800; }
.cb.cere { border-color: var(--spirit); background: #091f1c; }
.cb.cere:hover { border-color: #ffffff; color: var(--spirit); }
.cb.guide { border-color: var(--gold); background: #241b05; }
.cb.guide:hover { border-color: #ffffff; color: var(--gold); }
.sigil { text-align: center; color: #334155; font-size: 1.5rem; margin: 20px 0; letter-spacing: 0.4em; }
#mtoggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
  background: #16171e;
  border: 2px solid var(--gold);
  color: var(--gold);
  font-size: 0.8rem;
  font-weight: 700;
  padding: 10px 16px;
  cursor: pointer;
  box-shadow: 4px 4px 0px #000;
  border-radius: 4px;
}
#mtoggle:hover { background: var(--gold); color: #000; }
.portrait { animation: fi .4s ease-out; }
.ptitle { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 900; color: var(--gold); text-align: center; margin-bottom: 6px; text-transform: uppercase; }
.parch { text-align: center; color: rgba(255, 255, 255, 0.4); margin-bottom: 28px; font-size: 0.85rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
.dentry { padding: 16px 0; border-bottom: 2px dashed #334155; display: grid; grid-template-columns: 110px 1fr; gap: 12px; }
.dname { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--gold); letter-spacing: 0.05em; }
.dtext { font-size: 1rem; color: rgba(255, 255, 255, 0.85); }
.srep { background: #16171e; border: 2px solid var(--blood); padding: 18px; margin: 24px 0; box-shadow: 4px 4px 0px #000; border-radius: 6px; }
.srep h3 { font-size: 0.8rem; font-weight: 800; color: var(--blood); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.05em; }
.srep p { font-size: 0.95rem; line-height: 1.6; margin-bottom: 12px; }
.restart {
  display: block;
  width: 100%;
  background: transparent;
  border: 2px solid var(--gold);
  color: var(--gold);
  font-weight: 800;
  font-size: 1.1rem;
  padding: 16px;
  cursor: pointer;
  text-transform: uppercase;
  box-shadow: 4px 4px 0px #000;
  margin-top: 32px;
  border-radius: 6px;
}
.restart:hover { background: var(--gold); color: #000; }
.mintro { text-align: center; padding: 20px 16px; }
.msym { font-size: 3.5rem; display: block; margin-bottom: 16px; color: var(--gold); }
.mintro h2 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 900; color: var(--gold); margin-bottom: 14px; text-transform: uppercase; }
.mintro p { color: rgba(255, 255, 255, 0.75); max-width: 480px; margin: 0 auto 24px; }
.bbtn {
  background: var(--gold);
  border: 2px solid #fff;
  color: #000;
  font-weight: 800;
  font-size: 1.1rem;
  padding: 14px 36px;
  cursor: pointer;
  text-transform: uppercase;
  box-shadow: 6px 6px 0px #000;
  border-radius: 6px;
}
.bbtn:hover { background: #fff; transform: translate(-2px, -2px); box-shadow: 8px 8px 0px #000; }
.sp { position: fixed; width: 4px; height: 4px; pointer-events: none; z-index: 0; }
.somatic-bridge {
  background: rgba(0,245,212,0.06);
  border: 2px solid var(--spirit);
  border-radius: 6px;
  padding: 16px 20px;
  margin: 18px 0;
  animation: soma-pulse 3s ease-in-out infinite;
}
@keyframes soma-pulse {
  0%,100% { box-shadow: 0 0 0px rgba(0,245,212,0); }
  50% { box-shadow: 0 0 16px rgba(0,245,212,0.25); }
}
.somatic-bridge .soma-title {
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--spirit); margin-bottom: 8px;
}
.somatic-bridge .soma-text {
  font-size: 0.95rem; color: rgba(255,255,255,0.85); line-height: 1.65; font-style: italic;
}
.somatic-bridge .soma-skip {
  font-size: 0.68rem; color: rgba(255,255,255,0.25); margin-top: 8px;
  text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; text-decoration: underline;
}
.somatic-bridge .soma-skip:hover { color: rgba(255,255,255,0.5); }
.watermark {
  text-align: center;
  font-size: 0.58rem;
  color: rgba(255, 255, 255, 0.04);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 40px;
  user-select: none;
}
</style>
</head>
<body>
<button id="mtoggle" onclick="toggleMusic()">♪ SOUND OFF</button>
<div id="game"></div>
<script>
// ═══════════════════════════════════════════════════════
// DYNAMIC PROCEDURAL MUTATORS & PERSISTED SEED ENGINE
// ═══════════════════════════════════════════════════════
const S = {
  scene: 'intro',
  d: { body: 0, mind: 0, rel: 0, spirit: 0 },
  shadows: [], ch: {}, ceremony: false, guideRecognized: false, reactionCount: 0,
  seed: {
    airportIdx: Math.floor(Math.random() * 4),
    days: [7, 8, 10][Math.floor(Math.random() * 3)],
    friend: ['Marco', 'Luca', 'Giulia', 'Sara', 'Dario', 'Elena', 'Pietro', 'Mia'][Math.floor(Math.random() * 8)],
    childWords: [
      `"You look like you're carrying something heavy. Are you sure it's yours?"`,
      `"The light around your forehead is flickering. Did you leave a door open behind you?"`,
      `"You walk like someone who thinks they are awake, but is still running in their sleep."`,
      `"They are still singing behind your eyes. Why are you trying to block the frequency?"`,
      `"If you give back what you stole from the underworld, your shadow will let you pass."`
    ][Math.floor(Math.random() * 5)],
    clock: ['02:48', '03:07', '03:22', '03:41', '04:03'][Math.floor(Math.random() * 5)],
    shamanText: [
      'The shaman does not look up. He knew you were coming back.',
      'The shaman smiles wildly into the shadow, calling your true name out loud.',
      'The shaman blows a spray of mapacho smoke across the matrix, sealing the architecture.',
      'The shaman continues rattling his leaves, shaking the illusions off your ribcage.'
    ][Math.floor(Math.random() * 4)],
    queueScene: ['supermarket', 'post office', 'pharmacy'][Math.floor(Math.random() * 3)],
    triggerScene: ['traffic light', 'pavement bump', 'train platform'][Math.floor(Math.random() * 3)],
    animal: [
      { name: 'jaguar', desc: 'Its spots are expanding geometric cubes. It watches your core structure dissolve.' },
      { name: 'condor', desc: 'Its wings expand across thirty thousand feet of cloud layer, catching ancestral drafts.' },
      { name: 'anaconda', desc: 'It coils directly around your central nervous axis, squeezing out the residual noise.' },
      { name: 'hummingbird', desc: 'It vibrates at a frequency that fractures your old calcified behavioral architectures.' },
      { name: 'black puma', desc: 'It steps from the blind spot of your ego, moving with complete, lethal integration.' }
    ][Math.floor(Math.random() * 5)],
    temptation: [
      { type: 'the ex', text: 'An unexpected notification flash on your lock screen. A portal back to the loop.' },
      { type: 'the drink', text: 'The condensation on the glass. The clean, synthetic erasure it guarantees.' },
      { type: 'the scroll', text: 'The infinite feed. Digital static to fill the baseline existential vacuum.' },
      { type: 'the inbox', text: 'A collection of artificial urgencies demanding immediate validation armor.' },
      { type: 'the argument', text: 'An invitation to defend your identity against a projection that doesn\'t matter.' }
    ][Math.floor(Math.random() * 5)],
    palette: ['Shadow', 'Jungle', 'Violet', 'Amber'][Math.floor(Math.random() * 4)],
    sessionID: String(Math.floor(10000 + Math.random() * 90000))
  }
};

const palettes = {
  Shadow: { ink: '#020204', blue: '#0022ff', g3: '#475569' },
  Jungle: { ink: '#040d08', blue: '#059669', g3: '#155e75' },
  Violet: { ink: '#0a0518', blue: '#7c3aed', g3: '#4c1d95' },
  Amber:  { ink: '#0f0802', blue: '#ea580c', g3: '#78350f' }
};
const cp = palettes[S.seed.palette];
document.documentElement.style.setProperty('--bg-color', cp.ink);
document.documentElement.style.setProperty('--arcade-blue', cp.blue);
document.documentElement.style.setProperty('--g3', cp.g3);

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ═══════════════════════════════════════════════════════
// CHIPTUNE SOUND GENERATION LOGIC
// ═══════════════════════════════════════════════════════
let AC=null, musicOn=false, currentMood=null, seqInterval=null;
const currentNodes=[];
function getAC(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); return AC; }
function stopMusic(){ if(seqInterval) clearInterval(seqInterval); currentNodes.forEach(n=>{try{n.stop();}catch(e){}}); currentNodes.length=0; }
function play8BitTone(freq, duration, type='square', gainVal=0.04, detuneVal=0){
  if(!musicOn) return;
  const ac=getAC(); const osc=ac.createOscillator(); const gainNode=ac.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq, ac.currentTime); osc.detune.setValueAtTime(detuneVal, ac.currentTime);
  gainNode.gain.setValueAtTime(gainVal, ac.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + duration);
  osc.connect(gainNode); gainNode.connect(ac.destination); osc.start(); osc.stop(ac.currentTime + duration); currentNodes.push(osc);
}
const loops={
  city: [110, 116, 130, 110, 146, 138, 110, 98],
  jungle: [73, 87, 73, 110, 98, 73, 65, 55],
  ceremony: [146, 220, 293, 220, 349, 329, 220, 196],
  guide: [220, 277, 329, 392, 440, 392, 329, 277],
  insomnia: [55, 58, 55, 65, 55, 48, 41, 36]
};
function startChiptuneLoop(mood){
  stopMusic(); if(!loops[mood]) return; let step=0; const notes=loops[mood];
  seqInterval=setInterval(()=>{
    if(!musicOn) return; const baseNote=notes[step % notes.length];
    play8BitTone(baseNote, 0.4, 'square', 0.03);
    if(step % 2 === 0) play8BitTone(baseNote * 1.5, 0.8, 'square', 0.015, 12);
    if(step % 4 === 0) play8BitTone(baseNote * 0.5, 1.5, 'triangle', 0.06);
    step++;
  }, 350);
}
function setMood(m){ if(!musicOn) return; if(m===currentMood) return; currentMood=m; startChiptuneLoop(m); }
function toggleMusic(){
  const ac = getAC();
  if(!musicOn){ 
    musicOn=true; 
    document.getElementById('mtoggle').textContent='♪ SOUND ON'; 
    if(ac.state === 'suspended') ac.resume();
    setMood(currentMood||'city'); 
  }
  else { musicOn=false; document.getElementById('mtoggle').textContent='♪ SOUND OFF'; stopMusic(); currentMood=null; }
}

// ═══════════════════════════════════════════════════════
// PAC-MAN / SPACE INVADERS GRAPHICS FRAMEWORK
// ═══════════════════════════════════════════════════════
const PX = { bg: '#000000', blue: '#0022ff', g1: '#16171e', g2: '#2b2e3a', g3: '#4f5569', w1: '#ffffff', w2: '#cbd5e1', gold: '#ffb703', spirit: '#00f5d4', blood: '#ff3e3e', blood_d: '#991b1b' };
function svgStart(){return `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="192" viewBox="0 0 128 48" shape-rendering="crispEdges">`;}
const SE='</svg>'; function R(x,y,w,h,c){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;}
function P(x,y,c){return R(x,y,1,1,c);} function HL(x,y,w,c){return R(x,y,w,1,c);} function VL(x,y,h,c){return R(x,y,1,h,c);}
function mazeWalls(c) {
  let s=''; s+=R(0,0,128,2,c)+R(0,46,128,2,c)+R(0,0,2,48,c)+R(126,0,2,48,c);
  for(let x=12; x<120; x+=24) { s+=R(x,8,6,10,c)+R(x+10,28,6,10,c); } return s;
}
function dotFill(x0,y0,w,h,c) {
  let s=''; for(let y=y0; y<y0+h; y+=4){ for(let x=x0; x<x0+w; x+=4){ s+=R(x,y,2,2,c); } } return s;
}
// Large ghost — 14×16 px, very visible
function ghost(x,y,c,eye='#000') {
  return R(x+4,y,6,2,c)+R(x+2,y+2,10,2,c)+R(x,y+4,14,8,c)+
    R(x,y+12,3,4,c)+R(x+4,y+12,3,4,c)+R(x+8,y+12,3,4,c)+R(x+11,y+12,3,4,c)+
    // eyes
    R(x+2,y+5,3,3,PX.w1)+R(x+9,y+5,3,3,PX.w1)+
    R(x+3,y+6,1,1,eye)+R(x+10,y+6,1,1,eye);
}
// Large invader — 16×12 px
function invader(x,y,c) {
  return R(x+6,y,4,2,c)+R(x+4,y+2,8,2,c)+R(x+2,y+4,12,2,c)+
    R(x,y+6,16,2,c)+R(x,y+8,4,2,c)+R(x+6,y+8,4,2,c)+R(x+12,y+8,4,2,c)+
    R(x+2,y+10,4,2,c)+R(x+10,y+10,4,2,c)+
    // eyes
    R(x+4,y+4,2,2,PX.w1)+R(x+10,y+4,2,2,PX.w1);
}
// Hero sprite — the player character, 10×16
function hero(x,y,c,hair='#ffb703') {
  return R(x+3,y,4,2,hair)+R(x+2,y+2,6,4,c)+
    R(x+3,y+3,1,1,PX.w1)+R(x+6,y+3,1,1,PX.w1)+
    R(x+1,y+6,8,6,c)+R(x,y+8,2,4,'#8B4513')+R(x+8,y+8,2,4,'#8B4513')+
    R(x+2,y+12,3,4,c)+R(x+5,y+12,3,4,c);
}
// Serpent — sinuous 3-segment
function serpent(x,y,c) {
  return R(x,y+4,6,4,c)+R(x+5,y+2,6,4,c)+R(x+10,y+4,6,4,c)+R(x+15,y+2,6,4,c)+
    R(x+20,y+4,4,3,c)+R(x+22,y+2,4,4,c)+
    P(x+23,y+3,PX.w1)+P(x+24,y+5,PX.w1);
}
// Shaman — 10×18
function shaman(x,y,c,hat='#ffb703') {
  return R(x+2,y,6,3,hat)+R(x+1,y+3,8,4,c)+
    R(x+2,y+4,1,1,PX.w1)+R(x+7,y+4,1,1,PX.w1)+
    R(x,y+7,10,8,c)+R(x-2,y+9,3,3,'#8B4513')+R(x+9,y+9,3,3,'#8B4513')+
    R(x+2,y+15,3,5,c)+R(x+5,y+15,3,5,c);
}
// Child — small 8×12
function child(x,y,c,hair='#c8952a') {
  return R(x+1,y,6,2,hair)+R(x,y+2,8,4,c)+
    R(x+1,y+3,1,1,PX.w1)+R(x+6,y+3,1,1,PX.w1)+
    R(x,y+6,8,5,c)+R(x+1,y+11,3,3,c)+R(x+4,y+11,3,3,c);
}

const ARTS={
  intro:`${svgStart()}
    ${R(0,0,128,48,PX.bg)}${mazeWalls(PX.blue)}${dotFill(6,4,116,40,PX.g1)}
    ${ghost(10,16,PX.blood,'#ff0000')}
    ${hero(42,16,PX.spirit)}
    ${invader(72,17,PX.gold)}
    ${ghost(98,16,PX.spirit,'#006666')}
    ${R(0,44,128,4,PX.blue)}
  ${SE}`,

  airport:`${svgStart()}
    ${R(0,0,128,48,PX.bg)}${mazeWalls(PX.g2)}
    ${dotFill(4,4,120,36,PX.g1)}
    ${hero(14,20,PX.spirit)}
    ${ghost(50,20,PX.g3,'#888')}${ghost(68,20,PX.g3,'#888')}${ghost(86,20,PX.g3,'#888')}
    ${R(104,20,14,16,PX.blood)}${R(106,22,10,12,PX.bg)}
    ${R(0,44,128,4,PX.blue)}
  ${SE}`,

  plane:`${svgStart()}
    ${R(0,0,128,48,'#0a1628')}
    ${R(0,20,128,8,PX.g2)}${R(0,28,128,20,PX.bg)}
    ${R(4,12,60,26,PX.g2)}${R(6,14,56,22,PX.bg)}${R(8,16,52,18,'#0a2040')}
    ${R(20,20,14,8,PX.g2)}${R(40,20,14,8,PX.g2)}
    ${hero(24,14,PX.spirit)}
    ${ghost(80,14,PX.blood)}
    ${R(0,44,128,4,'#0a2040')}
  ${SE}`,

  homecoming:`${svgStart()}

        'Your attention. That was what the guide gave back. The full kind — the kind you give to something you love, or to a sky that has just opened. You had been rationing it all week, spending it only on what felt important enough. The guide returned the unrationed version. It is heavier than expected. It is also the only thing that was ever actually yours.',
        'You were seen completely. Not assessed, not advised — witnessed. The guide looked at you without blinking. Nothing needed to change. Nothing needed to be explained. You were simply, fully, looked at. It turns out this is what you had been hungry for all week, beneath every other hunger.',
        'The queue, the traffic, the colleague, the friend — from outside, from elevation, they look like exactly what they are: patterns running themselves through available circumstances. You were not failing. You were inside the pattern. From here you can see the pattern has edges. It is not the whole territory.',
        'The ceremony is not doing something to your life. It is asking you to do something with it. The fire said it. The shaman knew it. The guide walked away rather than explain it further, because explanation would have made it smaller. It must be carried as a question, not stored as an answer.'
      ];
      return`
        <div class="ctext">And then you are back. The ceiling is the ceiling. The clock reads ${S.seed.clock}. Not a minute has passed.</div>
        <div class="ctext">${msgs[c]}</div>
        <p style="color:#a0f5d4;">The room is different. You are different, again, in a different way. The ceremony has performed a second act you did not know was available.</p>`;
    },
    choices:()=> [
      {t:'You stay completely motionless. You let the firmware update compile into your cells.',tags:{spirit:1,body:1},sh:null,nx:'practice',isCeremony:true},
      {t:'You immediately write out the raw logs before memory allocation blocks are overwritten.',tags:{mind:1,spirit:1},sh:null,nx:'practice',isCeremony:true},
      {t:'You execute a single silent oath binding your central loop to the entity network.',tags:{spirit:2},sh:null,nx:'practice',isCeremony:true},
      {t:'Your system drops into a total hardware sleep cycle. Deep. Absolute. Protected.',tags:{body:2},sh:null,nx:'practice',isCeremony:true}
    ]
  },

  practice:{
    mood:'jungle',label:'DAY SEVEN · CORE CONFIGURATION',title:'The Pre-Dawn Processing Block',art:'practice',
    body:()=>`
      <p>The matrix outside is totally silent. The background city program hasn\'t initialized yet.</p>
      ${tends('spirit',4)?`<div class="vis">The veil parameters are set to ultra-thin. You grasp now that ceremony is not a place — it is an active state of high-fidelity attention processing.</div>`:''}
      ${S.ceremony?`<div class="ctext">The token granted by the ${S.seed.animal.name.toUpperCase()} hasn\'t cleared out. It glows steady inside your system core.</div>`:''}
      <p>Thirty minutes before standard routine execution. The processing space is open.</p>`,
    choices:()=> [
      {t:'You initiate physical movement calculations. The integration code passes directly into the bone structure.',tags:{body:1,spirit:1},sh:null,nx:'morning'},
      {t:'You execute absolute silent presence. No tools. Just tracking the changing light.',tags:{spirit:1},sh:null,nx:'morning'},
      {t:'You stream raw thoughts into text arrays, parsing the edge of your current understanding.',tags:{mind:1},sh:null,nx:'morning'},
      {t:'You generate a specific output commitment targeted at one specific relationship coordinate today.',tags:{rel:1,body:1},sh:null,nx:'morning'}
    ]
  },

  morning:{
    mood:'jungle',label:'DAY SEVEN · EXECUTION LIVE',title:'The Morning After the Week',art:'morning',
    body:()=>`
      <p>The sun hits the grid cleanly. The world initializes: transit vectors, data lines, life forms moving.</p>
      <p>System diagnostic: what has anchored? What has dropped back into legacy code loops? The raw vision arrays are clearing out from RAM, but the internal generator remains hot.</p>
      ${S.guideRecognized?`<div class="guide-text">The messenger\'s diagnostic query remains persistent inside your runtime loop: <em>Are you sure it\'s yours?</em></div>`:''}
      ${S.reactionCount>=2&&!S.guideRecognized?`<div class="shv">The historical automated code was highly aggressive this cycle. It took its toll. This is not an execution crash. It is simply the layout of the work.</div>`:''}
      <p>One week of run-time completed. The baseline system has been optimized. What is the permanent configuration you lock into the system bios?</p>`,
    choices:()=> [
      {t:'Commit to the Hardware Vessel: Absolute maintenance of the physical body mechanics, breath, water.',tags:{body:1},sh:null,nx:'end'},
      {t:'Commit to the Core Processor: Constant manual alignment of narrative language, analytical integration.',tags:{mind:1},sh:null,nx:'end'},
      {t:'Commit to the Connection Network: Direct, uncompressed, fully-witnessed exchange with external nodes.',tags:{rel:1},sh:null,nx:'end'},
      {t:'Commit to the Invisible Signal: Constant tracking of the subterranean field dynamics beneath the world grid.',tags:{spirit:1},sh:null,nx:'end'}
    ]
  },

  end:{isEnd:true}
};

// ═══════════════════════════════════
// REGISTERS & PROFILE RENDERS
// ═══════════════════════════════════
const DR={
  body:{low:'The body has been left at the gate. Your integration lives in the mind and in symbols — but the animal self waits for you, patient and unreached.',mid:'You are beginning to listen to what the body knows. It carries the ceremony in its cells even when the mind has moved on.',high:'Your integration lives in the flesh. You understand that the body is not the obstacle to spirit — it is the altar.'},
  mind:{low:'The mind has been quiet — afraid, perhaps, of what naming might fix in place.',mid:'You reach for meaning, for structure, for words that can hold the formless. Necessary work.',high:'The mind is your primary vessel. You name things accurately — but naming can also pin them like butterflies.'},
  rel:{low:'You returned alone and you are staying alone. Something still resists.',mid:'You feel the tension between your new self and the people who knew the old one. This friction is the work itself.',high:'You understand that no medicine integrates in isolation. The ceremony continues in every encounter.'},
  spirit:{low:'The spiritual dimension is closing back over, like water over a stone. Practice is not optional.',mid:'You carry the luminous thread, but loosely. Resist filing it away.',high:'The veil remains thin for you. You continue to see. This is both gift and responsibility.'}
};
const SDEFS={
  'The Retreater':'You protected what was sacred by making yourself unavailable. This has wisdom. But integration happens in contact, not only in solitude.',
  'The Keeper':'You learned that the world is not always safe for truth. But secrets calcify — they become load-bearing walls inside the self.',
  'The Prophet':'You speak truths the room is not yet ready to receive. Truth needs a listener.',
  'The Mask-Wearer':'This mask was built for survival. Now it appears before you have decided to wear it.',
  'The Mirror':'You have infinite empathy and almost no self in the presence of others.',
  'The Reactor':'You discovered this week that the old circuitry is fast. Stimulus -> response, before the witness has time to step in.',
  'The Negotiator':'The Negotiator finds the loophole in every commitment.',
  'The Swallower':'The Swallower ingests injustice and converts it to internal weather. What is swallowed does not disappear.'
};
const ARCHS=[
  {n:'The Sovereign Returning',s:'You crossed the threshold fully. The gifts were received and carried.',c:d=>d.body>=3&&d.spirit>=4},
  {n:'The Jaguar-Touched',s:'The ceremony found you in the dark. You went back when called. This is rare.',c:()=>S.ceremony&&S.d.spirit>=3},
  {n:'The Open Gate',s:'You recognized the guide in the child. The doors they offer are always ordinary.',c:()=>S.guideRecognized&&S.d.spirit>=2},
  {n:'The Wounded Healer',s:'You know the wound because it is yours. This is qualification.',c:d=>d.spirit>=2&&d.rel>=2},
  {n:'The Embodied Witness',s:'You ground the invisible in flesh. This is a rare and necessary gift.',c:d=>d.body>=3&&d.mind>=2},
  {n:'The Bridge Walker',s:'You move between worlds without losing either.',c:d=>d.rel>=3},
  {n:'The Cartographer of the Interior',s:'You map what others cannot see. Inhabit the territory.',c:d=>d.mind>=4},
  {n:'The One Still Crossing',s:'The river is wide. You are in the middle. This is exactly where you should be.',c:()=>true}
];

function getArch(){return ARCHS.find(a=>a.c(S.d));}
function dlvl(v){return v<=1?'low':v<=2?'mid':'high';}

function renderPortrait(){
  const arch=getArch(); const uSh=[...new Set(S.shadows)];
  const domainLabels={body:'body',mind:'mind',rel:'relating',spirit:'spirit'};
  const domHTML=Object.entries(S.d).map(([k,v])=>`<div class="dentry"><div class="dname">${domainLabels[k]||k}</div><div class="dtext">${DR[k][dlvl(v)]}</div></div>`).join('');
  
  const gNote=S.guideRecognized?`<div class="guide-text" style="margin-bottom:20px;">You recognized the guide. A child said something on a step outside a shop, and something in you stopped long enough to hear it. This is the whole practice. The guide comes in every form. The recognition is everything.</div>`:'';
  const cNote=S.ceremony?`<div class="ctext" style="margin-bottom:20px;">The ceremony found you in the dark. The ${S.seed.animal.name} came. Something was placed in you that you had almost discarded — your own unrationed attention. The guide returns what is already yours. Carry it carefully.</div>`:'';
  const rNote=S.reactionCount>=2?`<div class="jmirror" style="margin-bottom:20px;">The old patterns showed themselves clearly this week — in the queue, in the traffic, in the room with your colleague. You saw them running. Seeing is not stopping them. But it is the necessary first step. The gap between signal and response is where your practice lives.</div>`:'';
  const sHTML=uSh.length?`<div class="srep"><h3>■ ACTIVE SHADOW REGISTER</h3>${uSh.map(s=>`<p><strong>${s}</strong><br>${SDEFS[s]||''}</p>`).join('')}</div>`:`<div class="srep"><h3>■ SHADOW FIELD INACTIVE</h3><p>No major legacy shadow profiles claimed runtime dominance during this transit. The core codes remain patient in memory allocation.</p></div>`;
  
  return `<div class="portrait">
    ${art('end','')}
    <div class="sigil">■ ✦ ■</div>
    <div class="ptitle">${arch.n}</div>
    <div class="parch">${arch.s}</div>
    ${gNote}${cNote}${rNote}
    <div>${domHTML}</div>
    ${sHTML}
    <div class="vis" style="margin-top:20px;">
      The jungle does not end when you leave it.<br>
      It moves with you — in the quality of your attention,<br>
      in what you can no longer ignore,<br>
      in the eyes you now use to see the world.<br><br>
      The question is never <em>did the ceremony work?</em><br>
      The question is always <em>are you doing the work the ceremony began?</em>
    </div>
    <button class="restart" onclick="restart()">↩ Execute New Sequence Return</button>
  </div>`;
}


// ═══════════════════════════════════════════════════════
// SOMATIC BRIDGE
// ═══════════════════════════════════════════════════════
let somaticBridgeFired = false;
const SOMATIC_PROMPTS = [
  { breath: 'Place your feet flat on the floor. Feel the weight of your body.', exhale: 'Exhale for four slow counts.', anchor: 'Now — from here — choose.' },
  { breath: 'Before you act: one hand on your chest. Feel it moving.', exhale: 'Breathe out until the breath is completely empty.', anchor: 'From this place — choose.' },
  { breath: 'Your jaw is carrying something. Let it soften slightly.', exhale: 'Three slow breaths. Not to fix anything — just to arrive.', anchor: 'Present — choose.' },
  { breath: 'Notice where in your body the charge is sitting. Just locate it.', exhale: 'Exhale through the mouth, long and quiet.', anchor: 'Make the choice from here.' },
];
function somaticBridge(choicesHTML, sceneKey) {
  const stressScenes = ['supermarket', 'traffic', 'colleague', 'temptation'];
  if (somaticBridgeFired || !stressScenes.includes(sceneKey) || S.shadows.length === 0) return choicesHTML;
  somaticBridgeFired = true;
  const p = SOMATIC_PROMPTS[Math.floor(Math.random() * SOMATIC_PROMPTS.length)];
  return `<div class="somatic-bridge" id="somaticBridge">
    <div class="soma-title">◈ Before you act</div>
    <div class="soma-text">${p.breath}<br>${p.exhale}<br><br><strong style="color:var(--spirit);">${p.anchor}</strong></div>
    <div class="soma-skip" onclick="document.getElementById('somaticBridge').style.display='none';document.getElementById('choicesWrap').style.display='flex';">skip — I am ready</div>
  </div>
  <div id="choicesWrap" style="display:none;flex-direction:column;gap:12px;">${choicesHTML}</div>`;
}
// ═══════════════════════════════════
// CONTROLLER & CORE MECHANICS
// ═══════════════════════════════════
function initializeGameAudioAndStart() {
  const ac = getAC();
  musicOn = true;
  document.getElementById('mtoggle').textContent = '♪ SOUND ON';
  if (ac.state === 'suspended') {
    ac.resume();
  }
  go('airport');
}

function choose(scKey, choiceId){
  const sc=SCENES[scKey];
  const rawChoices = typeof sc.choices === 'function' ? sc.choices() : sc.choices;
  const ch = rawChoices.find(c => (typeof c.id !== 'undefined' ? c.id === choiceId : rawChoices.indexOf(c) === choiceId));
  
  Object.entries(ch.tags).forEach(([d,v])=>{S.d[d]=(S.d[d]||0)+v;});
  if(ch.sh) S.shadows.push(ch.sh);
  S.ch[scKey]=choiceId;
  
  if(ch.sh==='The Reactor') S.reactionCount++;
  if(ch.isGuide) S.guideRecognized=true;
  if(sc.isCere || ch.isCeremony) S.ceremony=true;
  go(ch.nx);
}

function go(id){ S.scene=id; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function restart(){ window.location.reload(); }

function dbar(){
  if(S.scene==='intro') return '';
  const labels={body:'body',mind:'mind',rel:'relating',spirit:'spirit'};
  return `<div class="dbar">${Object.entries(S.d).map(([k,v])=>{
    const cls=v>=3?'deep':v>=1?'on':''; return `<div class="dp ${cls}">${labels[k]||k}</div>`;
  }).join('')}</div>`;
}

function render(){
  const game=document.getElementById('game'); const sc=SCENES[S.scene]; setMood(sc.mood||'city');
  if(sc.render){
    game.innerHTML=`<div class="gh"><div class="gt">THE RETURN</div><div class="gs">a mythic journey of integration</div></div>${art('intro','')}<div class="scene">${sc.render()}</div><div class="watermark">SESSION #0${S.seed.sessionID} · ${S.seed.palette.toUpperCase()} PALETTE · GUIDE: ${S.seed.animal.name.toUpperCase()}</div>`; return;
  }
  if(sc.isEnd){
    game.innerHTML=`<div class="gh"><div class="gt">THE RETURN</div><div class="gs">your system status</div></div><div class="scene">${renderPortrait()}</div><div class="watermark">SESSION #0${S.seed.sessionID} · ${S.seed.palette.toUpperCase()} PALETTE · GUIDE: ${S.seed.animal.name.toUpperCase()}</div>`; return;
  }
  const body=typeof sc.body==='function'?sc.body():sc.body;
  const isCere=sc.isCere||false;
  
  const rawChoices = typeof sc.choices === 'function' ? sc.choices() : sc.choices;
  const rawChHTML=rawChoices.map((c,i)=>{
    const targetId = typeof c.id !== 'undefined' ? c.id : i;
    return `<button class="cb${isCere?' cere':(typeof sc.label === 'string' && sc.label.includes('ENCOUNTER'))?' guide':''}" onclick="choose('${S.scene}', ${targetId})"><span class="ck">[${i+1}]</span>${c.t}</button>`;
  }).join('');
  const chHTML = somaticBridge(rawChHTML, S.scene);
  
  const displayTitle = typeof sc.title === 'function' ? sc.title() : sc.title;
  const displayLabel = typeof sc.label === 'function' ? sc.label() : sc.label;
  const sub=isCere?'the ceremony within the return':(typeof sc.label === 'string' && sc.label.includes('ENCOUNTER'))?'the accidental guide':'a mythic journey of integration';
  
  game.innerHTML=`
    <div class="gh"><div class="gt">THE RETURN</div><div class="gs">${sub}</div></div>
    ${dbar()}
    <div class="scene">
      <div class="slabel">${displayLabel||''}</div>
      ${art(sc.art||S.scene,sc.artCls||'')}
      <div class="stitle">${displayTitle}</div>
      <div class="sbody">${body}</div>
      <div class="sigil">${isCere?'✦ ■ ✦':'■'}</div>
      <div class="choices">${chHTML}</div>
    </div>
    <div class="watermark">SESSION #0${S.seed.sessionID} · ${S.seed.palette.toUpperCase()} PALETTE · GUIDE: ${S.seed.animal.name.toUpperCase()}</div>`;
}

for(let i=0;i<12;i++){
  const p=document.createElement('div'); p.className='sp';
  p.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;background:${Math.random()>.5?PX.spirit:PX.gold};opacity:${.08+Math.random()*.1}`;
  document.body.appendChild(p);
}
render();
</script>
</body>
</html>
